      <line x1="367" y1="278" x2="354" y2="271"/><line x1="320" y1="325" x2="313" y2="312"/>
      <line x1="192" y1="325" x2="199" y2="312"/><line x1="145" y1="278" x2="158" y2="271"/>
      <line x1="145" y1="150" x2="158" y2="157"/><line x1="192" y1="103" x2="199" y2="116"/>
    </g>
  </g>
  <!-- Zeiger: fünf vor acht -->
  <line x1="256" y1="214" x2="196" y2="250" stroke="#2a1d14" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="214" x2="214" y2="112" stroke="#e30613" stroke-width="11" stroke-linecap="round"/>
  <circle cx="256" cy="214" r="13" fill="#3aa935" stroke="#2a1d14" stroke-width="4"/>

  <!-- Hammer -->
  <g transform="rotate(-38 330 330)">
    <rect x="316" y="250" width="30" height="190" rx="12" fill="url(#stiel)" stroke="#2a1d14" stroke-width="7"/>
    <rect x="262" y="214" width="138" height="54" rx="12" fill="url(#kopf)" stroke="#2a1d14" stroke-width="7"/>
    <rect x="262" y="214" width="24" height="54" rx="8" fill="#5b636c" stroke="#2a1d14" stroke-width="7"/>
  </g>

  <!-- grüner Zollstock -->
  <g transform="translate(0 420)">
    <rect x="-10" y="0" width="532" height="58" fill="#3aa935"/>
    <rect x="-10" y="0" width="532" height="58" fill="none" stroke="#1f6b1c" stroke-width="6"/>
    <g fill="#ffffff">
      <rect x="20" y="4" width="5" height="26"/><rect x="40" y="4" width="4" height="14"/><rect x="60" y="4" width="4" height="14"/><rect x="80" y="4" width="4" height="14"/>
      <rect x="100" y="4" width="5" height="26"/><rect x="120" y="4" width="4" height="14"/><rect x="140" y="4" width="4" height="14"/><rect x="160" y="4" width="4" height="14"/>
