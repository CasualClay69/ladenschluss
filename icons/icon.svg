      <rect x="260" y="4" width="5" height="26"/><rect x="280" y="4" width="4" height="14"/><rect x="300" y="4" width="4" height="14"/><rect x="320" y="4" width="4" height="14"/>
      <rect x="340" y="4" width="5" height="26"/><rect x="360" y="4" width="4" height="14"/><rect x="380" y="4" width="4" height="14"/><rect x="400" y="4" width="4" height="14"/>
      <rect x="420" y="4" width="5" height="26"/><rect x="440" y="4" width="4" height="14"/><rect x="460" y="4" width="4" height="14"/><rect x="480" y="4" width="4" height="14"/>
      <rect x="500" y="4" width="5" height="26"/>
