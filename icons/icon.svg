  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" fill="url(#hg)"/>
  <g fill="#ffffff" opacity=".07">
    <circle cx="70" cy="80" r="60"/><circle cx="450" cy="140" r="40"/><circle cx="420" cy="330" r="70"/>
  </g>

  <!-- Ladenuhr: kurz vor Ladenschluss -->
  <circle cx="256" cy="214" r="150" fill="#7a000a" opacity=".35" transform="translate(0 10)"/>
  <circle cx="256" cy="214" r="150" fill="#ffffff"/>
  <circle cx="256" cy="214" r="150" fill="none" stroke="#3aa935" stroke-width="16"/>
  <g stroke="#2a1d14" stroke-linecap="round">
    <g stroke-width="10">
      <line x1="256" y1="86" x2="256" y2="112"/><line x1="384" y1="214" x2="358" y2="214"/>
      <line x1="256" y1="342" x2="256" y2="316"/><line x1="128" y1="214" x2="154" y2="214"/>
    </g>
    <g stroke-width="5">
