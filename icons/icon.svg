  <path d="M206 244 Q256 218 306 244 Q256 258 206 244 Z" fill="#4a2e1c" stroke="#2a1d14" stroke-width="6" stroke-linejoin="round"/>
  <path d="M230 282 Q256 296 282 282" fill="none" stroke="#8a4a3a" stroke-width="7" stroke-linecap="round"/>

  <!-- Augen -->
  <circle cx="214" cy="182" r="12" fill="#2a1d14"/>
  <circle cx="298" cy="182" r="12" fill="#2a1d14"/>
  <circle cx="218" cy="177" r="4" fill="#ffffff"/>
  <circle cx="302" cy="177" r="4" fill="#ffffff"/>
  <!-- Brille, dunkelbraun -->
  <g fill="none" stroke="#4a2e1c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <rect x="172" y="150" width="84" height="64" rx="20"/>
    <rect x="256" y="150" width="84" height="64" rx="20" transform="translate(8 0)"/>
    <path d="M256 172 Q260 164 264 172"/>
    <path d="M172 172 L146 166 M348 172 L366 166"/>
  </g>
  <g fill="#ffffff" opacity=".35">
    <rect x="184" y="160" width="18" height="8" rx="4"/><rect x="276" y="160" width="18" height="8" rx="4"/>
  </g>

  <!-- tuum-Schild -->
  <g transform="translate(256 432)">
    <rect x="-150" y="-50" width="300" height="100" rx="30" fill="#ffffff" stroke="#2a1d14" stroke-width="8"/>
    <text x="0" y="28" text-anchor="middle" font-family="Arial Rounded MT Bold, Nunito, Arial Black, sans-serif" font-weight="900" font-size="88" fill="#e30613" letter-spacing="-3">tuum</text>
  </g>
