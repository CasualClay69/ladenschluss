<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="hg" cx=".5" cy=".38" r=".75">
      <stop offset="0" stop-color="#ff3a45"/>
      <stop offset=".6" stop-color="#e30613"/>
      <stop offset="1" stop-color="#a3000e"/>
    </radialGradient>
    <linearGradient id="stiel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a066"/><stop offset="1" stop-color="#a8703a"/>
    </linearGradient>
    <linearGradient id="kopf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf1"/><stop offset="1" stop-color="#8f9aa6"/>
