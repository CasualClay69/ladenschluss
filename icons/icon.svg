<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="hg" cx=".5" cy=".35" r=".8">
      <stop offset="0" stop-color="#ff3a45"/>
      <stop offset=".55" stop-color="#e30613"/>
      <stop offset="1" stop-color="#a3000e"/>
    </radialGradient>
    <radialGradient id="haut" cx=".42" cy=".35" r=".75">
      <stop offset="0" stop-color="#ffdcb8"/>
      <stop offset="1" stop-color="#eebf92"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund mit Strahlen -->
  <rect width="512" height="512" fill="url(#hg)"/>
  <g fill="#ffffff" opacity=".07">
    <path d="M256 200 L120 -20 L200 -20 Z"/><path d="M256 200 L330 -20 L410 -20 Z"/>
    <path d="M256 200 L-20 60 L-20 150 Z"/><path d="M256 200 L532 60 L532 150 Z"/>
  </g>

  <!-- Oberkörper: graues Shirt, rote tuum-Schürze -->
  <g stroke="#2a1d14" stroke-width="9" stroke-linejoin="round">
    <path d="M70 512 Q74 360 176 330 L336 330 Q438 360 442 512 Z" fill="#8f9aa6"/>
    <path d="M150 512 L162 372 Q256 348 350 372 L362 512 Z" fill="#c4000f"/>
    <path d="M196 338 L196 372 M316 338 L316 372" fill="none"/>
  </g>

  <!-- Ohren -->
  <g stroke="#2a1d14" stroke-width="8" fill="url(#haut)">
    <ellipse cx="140" cy="210" rx="24" ry="30"/>
    <ellipse cx="372" cy="210" rx="24" ry="30"/>
  </g>
  <!-- Kopf mit Glatze -->
  <circle cx="256" cy="190" r="118" fill="url(#haut)" stroke="#2a1d14" stroke-width="9"/>
  <ellipse cx="208" cy="112" rx="38" ry="16" fill="#ffffff" opacity=".5" transform="rotate(-25 208 112)"/>

  <!-- Kurzer Vollbart, dunkelbraun -->
  <path d="M140 196 Q142 322 256 330 Q370 322 372 196 Q354 268 300 266 Q256 252 212 266 Q158 268 140 196 Z"
